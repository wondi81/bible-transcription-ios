name: BibleTranscription
options:
  bundleIdPrefix: com.ztw
  deploymentTarget:
    iOS: "17.0"
targets:
  BibleTranscription:
    type: application
    platform: iOS
    sources: [Sources/BibleTranscription]
    info:
      path: Sources/BibleTranscription/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - NotoSerifKR-Variable.ttf
          - Pretendard-Regular.ttf
          - Pretendard-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztw.bibletranscription
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  BibleTranscription:
    build:
      targets:
        BibleTranscription: all
    run:
      config: Debug
