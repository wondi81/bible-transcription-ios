name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project BibleTranscription.xcodeproj \
            -scheme BibleTranscription \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Screenshot on simulator
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Debug-iphonesimulator/BibleTranscription.app"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d['name'] == 'iPhone 16':
                      print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          # --console: simctl launch만으로는 앱의 print() 출력이 캡처되지 않음(PID만 반환하고 종료).
          xcrun simctl launch --console "$DEVICE_ID" com.ztw.bibletranscription > app_console.log 2>&1 &
          LAUNCH_PID=$!
          sleep 8
          kill "$LAUNCH_PID" 2>/dev/null || true
          if [ -f app_console.log ]; then cat app_console.log; fi
          xcrun simctl io "$DEVICE_ID" screenshot screenshot.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
