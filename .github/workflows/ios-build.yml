name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project BibleTranscription.xcodeproj \
            -scheme BibleTranscription \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Screenshot on simulator
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Debug-iphonesimulator/BibleTranscription.app"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d['name'] == 'iPhone 16':
                      print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          # --console-pty: 일반 파일로 리다이렉트하면 앱 프로세스가 풀 버퍼링을 써서
          # SIGTERM으로 죽일 때 버퍼가 플러시 안 된 채 유실됨(--console으로 실측: 로그 0바이트).
          # 가짜 TTY를 붙이면 앱이 라인 버퍼링을 쓰게 되어 출력이 즉시 simctl로 전달됨.
          # SIMCTL_CHILD_ 접두사: 시뮬레이터 앱 프로세스에 환경변수를 전달하는 공식 방법(-e 플래그 아님).
          # 31,102건 백그라운드 시딩(최초 실행에만 발생)이 완료되기까지 15초로는 부족하고
          # 45초 대기에서는 실측 성공함을 확인함(2026-09-06) - 여유를 두고 40초로 고정.
          SIMCTL_CHILD_CI_AUTO_SEED=1 xcrun simctl launch --console-pty "$DEVICE_ID" com.ztw.bibletranscription > app_console.log 2>&1 &
          LAUNCH_PID=$!
          sleep 40
          kill "$LAUNCH_PID" 2>/dev/null || true
          echo "=== app console log ==="
          if [ -f app_console.log ]; then cat app_console.log; fi
          xcrun simctl io "$DEVICE_ID" screenshot screenshot.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
